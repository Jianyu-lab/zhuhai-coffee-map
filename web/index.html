<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>珠海咖啡地图 · Zhuhai Coffee Map</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23E0A458'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2317130f' stroke-width='2.4' stroke-dasharray='33' stroke-dashoffset='8'/%3E%3C/svg%3E">
<!-- LiquidLens（MIT）——液态玻璃材质。tokens 必须在 liquid-glass.css 之前，
     两者都要在 style.css 之前，方便后面覆盖 -->
<link rel="stylesheet" href="vendor/liquidlens/tokens.css">
<link rel="stylesheet" href="vendor/liquidlens/liquid-glass.css">
<link rel="stylesheet" href="style.css">
<!-- 主题必须在样式表解析后、body 绘制前定好，否则深色用户会先看到一帧亮色加载画面。
     app.js 在 body 末尾才执行，赶不上第一帧，所以这里先同步定一次。 -->
<script>
(function () {
  try {
    var t = localStorage.getItem('zh_coffee_theme_v1');
    if (t !== 'dark' && t !== 'light') {
      t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
</head>
<body>

<!-- 加载画面：高德 JS API 的链路（maps→migrate→init→checkredirect→icons）实测要 1.6s，
     这期间屏幕是全黑的，用户会以为卡死。标记放在 body 最前面、样式在 head 的 style.css 里，
     所以第一帧就能画出来，不依赖任何 JS。
     不再套玻璃卡：卡片会把"等 1.6 秒"包装成一个要读的物件，而这里只需要一个
     "还在动"的信号。整屏只留一条进度条 + 一行状态字，落在一层暖色底上。 -->
<div id="loader">
  <div class="ld-inner">
    <div class="ld-bar"><i></i></div>
    <p class="ld-stage" id="ld-stage">正在加载地图引擎…</p>
  </div>
</div>

<div id="map"></div>

<aside id="panel" class="lg-glass" data-glass>
  <header class="brand">
    <div class="brand-row">
      <div>
        <h1>珠海咖啡地图</h1>
        <p class="sub">ZHUHAI COFFEE MAP</p>
      </div>
      <button id="theme-btn" title="切到深色">☾</button>
      <button id="collapse" title="收起面板">‹</button>
    </div>
    <div class="counts">
      <span><b id="c-total">—</b> 家咖啡馆</span>
      <span class="dot-sep"></span>
      <span>连锁 <b id="c-chain">—</b></span>
      <span class="dot-sep"></span>
      <span>独立 <b id="c-indie">—</b></span>
    </div>
  </header>

  <div class="scroll">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <input id="q" type="search" placeholder="搜店名、品牌、地址…" autocomplete="off">
      <button id="q-clear" title="清除">×</button>
    </div>

    <section id="sec-dist" class="hidden">
      <h2>距我 <span class="hint">点右上角「定位」</span></h2>
      <div class="chips" id="f-dist"></div>
    </section>

    <section>
      <h2>区域</h2>
      <div class="chips" id="f-district"></div>
    </section>

    <section>
      <h2>类型</h2>
      <div class="chips" id="f-kind"></div>
    </section>

    <section>
      <h2>评分</h2>
      <div class="chips" id="f-rating"></div>
    </section>

    <section>
      <h2>人均</h2>
      <div class="chips" id="f-cost"></div>
    </section>

    <section>
      <h2>特色 <span class="hint">可多选</span></h2>
      <div class="chips" id="f-tags"></div>
    </section>

    <section>
      <h2>品牌 <span class="hint">点击筛选</span></h2>
      <div class="brands" id="f-brand"></div>
    </section>

    <section>
      <h2>商圈分布</h2>
      <div class="bars" id="stats-area"></div>
    </section>

    <section class="mylist">
      <button id="saved-btn" class="ghost">☆ 我的收藏 <b id="c-saved">0</b></button>
    </section>

    <footer>
      数据来源：高德地图 POI<br>
      分类码 <code>050500</code> 全域扫描 + 中英文关键词补采<br>
      共采集 <b id="c-raw">—</b> 家 · 最后更新 <span id="updated">—</span><br>
      <span class="warn">高德未收录的小店不会出现在这里，出行前请以门店实际为准。</span>
    </footer>
  </div>
</aside>

<div id="toolbar">
  <!-- 这几个按钮**故意不带 data-glass**：引擎的 SVG 折射在小尺寸元素上会把
       边缘以外的暗底吸进来，沿圆角形成一圈 2px 的黑边（53×36 的胶囊上特别明显，
       看着像描了个粗黑框）。保留 .lg-glass 的半透明底色和高光，
       磨砂效果由 style.css 里自己写的 backdrop-filter 提供。 -->
  <button id="btn-loc" class="tool lg-glass">定位</button>
  <button id="btn-label" class="tool lg-glass">标签</button>
  <button id="btn-rank" class="tool lg-glass active">排行</button>
  <button id="btn-bound" class="tool lg-glass active">区界</button>
  <button id="btn-fit" class="tool lg-glass">全览</button>
</div>

<aside id="rank" class="lg-glass" data-glass>
  <header>
    <div class="rk-top">
      <h2>评分排行</h2>
      <button id="rank-collapse" title="收起面板">›</button>
    </div>
    <div class="rk-sub">
      <span id="rank-count">—</span> 家 · 跟随左侧筛选
    </div>
    <div class="rk-sort" id="rank-sort">
      <button data-v="rating" class="on">评分</button>
      <button data-v="dist">距离</button>
      <button data-v="cost">人均</button>
    </div>
  </header>
  <div class="rk-scroll" id="rank-list"></div>
  <div class="rk-note" id="rank-note"></div>
</aside>

<div id="toast" class="lg-glass" data-glass></div>

<div id="legend" class="lg-glass" data-glass>
  <span><i class="lg chain"></i>连锁</span>
  <span><i class="lg indie"></i>独立</span>
  <span><i class="lg saved"></i>已收藏</span>
</div>

<div id="hint" class="hidden lg-glass" data-glass>拖动地图查看 · 点击圆点看详情</div>

<div id="empty" class="hidden lg-glass" data-glass>没有符合条件的咖啡馆，试试放宽筛选</div>

<!-- 高德 Key 不写进仓库：由 scripts/gen_config.py 生成 config.js（已 gitignore）注入。
     本地跑：python scripts/gen_config.py；CI 上由 GitHub Secrets 在构建时生成。
     必须放在 data/coffee.js 和 app.js 之前——config.js 用 document.write 同步插入
     高德脚本，时序和原来手写 <script> 标签一致，app.js 才能直接拿到 AMap。 -->
<!-- 液态玻璃引擎。放在 app.js 之前、和高德脚本解耦：
     高德加载失败时 app.js 会提前 return，但玻璃材质不该跟着一起失效。
     这里的值只是"首帧默认"，真值由 app.js 的 applyTheme() 按主题写：
     日光档 blur 16 / tint 0.76 / sat 0.50（磨砂，压得住满屏路网和绿地），
     暗色档 blur 2 / tint 0.26。两套都写在这里是为了首屏别先闪一版太透的玻璃。 -->
<script src="vendor/liquidlens/liquid-glass.js"></script>
<script>
  LiquidGlass.init({
    refraction: 20,     // 边缘折射强度（feDisplacementMap 的 scale）
    bezel: 26,          // 折射边宽度
    blur: 10,           // 背板模糊（日光档；暗色档同为 10，由 applyTheme 复核）
    saturation: 0.80,   // 背板去色：模糊压不住大片绿地/水面的色块，得先去色
    specular: 0.95,     // 高光强度
    tintHue: 32,        // 暖白（咖啡色调），不用默认的蓝
    tintOpacity: 0.68,
    quality: 420,
    /* 关掉"高光跟随鼠标"。开着的时候每次 pointermove 都会在 <html> 上写
       --lg-lx / --lg-ly / --lg-edge，等于全文档样式失效重算，十几个玻璃元素
       的 radial-gradient 跟着重绘；暗色档下那个白斑还会在面板里游走，
       看着像渲染 bug 而不是材质。关掉后高光固定在 tokens.css 的
       32% / 12%（左上打光），边缘光角度固定 140deg。 */
    pointer: false
  });
</script>
<script src="config.js"></script>
<script src="data/coffee.js"></script>
<script src="data/districts.js"></script>
<script src="app.js"></script>
</body>
</html>
